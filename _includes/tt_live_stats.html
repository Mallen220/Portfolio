<script>
  (function () {
    var repo = "Mallen220/TurtleTracer";
    if (!document.querySelector("[data-tt]")) return;

    function show(key, text) {
      document.querySelectorAll('[data-tt="' + key + '"]').forEach(function (el) {
        el.textContent = text;
      });
    }

    function getReleases(page, all) {
      return fetch(
        "https://api.github.com/repos/" + repo + "/releases?per_page=100&page=" + page
      )
        .then(function (r) {
          return r.ok ? r.json() : Promise.reject();
        })
        .then(function (batch) {
          all = all.concat(batch);
          return batch.length === 100 ? getReleases(page + 1, all) : all;
        });
    }

    getReleases(1, [])
      .then(function (releases) {
        var downloads = 0;
        releases.forEach(function (rel) {
          (rel.assets || []).forEach(function (a) {
            downloads += a.download_count;
          });
        });
        show("downloads", downloads.toLocaleString("en-US"));
        show("releases", String(releases.length));
      })
      .catch(function () {});

    fetch(
      "https://raw.githubusercontent.com/" + repo + "/main/README_Content/coverage-badge.svg"
    )
      .then(function (r) {
        return r.ok ? r.text() : Promise.reject();
      })
      .then(function (svg) {
        var m = svg.match(/Coverage: ([\d.]+)%/);
        if (m) show("coverage", parseFloat(m[1]).toFixed(1));
      })
      .catch(function () {});
  })();
</script>
